services:
  - type: web
    name: abr-ondas-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: abr-ondas-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://abr-ondas-email.grupoabr.chatgpt.site
      - key: MICROSOFT_SENDER_EMAIL
        value: thiago.almeida@grupoabr.com.br
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRACKING_SECRET
        generateValue: true

databases:
  - name: abr-ondas-db
    plan: free
    databaseName: abr_ondas
    user: abr_ondas
